# CI: typecheck, unit + security tests (against a throwaway local Supabase), dashboard build +
# Playwright, and a secret scan of the full git history. No repository secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The API imports the job queue at load time (webhook route), so give tests a real Redis
    # instead of connection-refused noise.
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Start test database (local Supabase, all migrations)
        # Prints KEY=VALUE lines for the DB-backed suites. Local defaults only, not secrets.
        # Written to a file first: in a pipe, a failed start was hidden (GitHub's default shell has no
        # pipefail), so tests then ran with no database. Now the step fails here, with the real error.
        shell: bash
        env:
          # The Supabase CLI pulls from public.ecr.aws by default, which rate-limits shared runner IPs
          # ("toomanyrequests: Data limit exceeded"). Docker Hub mirrors the same images.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          scripts/ci/test-db.sh > "$RUNNER_TEMP/test-db.env"
          sed 's/^export //' "$RUNNER_TEMP/test-db.env" >> "$GITHUB_ENV"
          grep -q '^export SUPABASE_URL=' "$RUNNER_TEMP/test-db.env"
      - name: Unit + security tests
        # CI=true makes the DB-backed isolation suites fail instead of skipping when env is missing.
        run: npm run test:run
        env:
          CI: 'true'
          REDIS_URL: redis://127.0.0.1:6379

  dashboard:
    name: Dashboard — typecheck, build, Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --no-banner --redact --verbose --exit-code 1
